name: Check Markdown Links

on:
  pull_request:
    paths:
      - '**.md'
  push:
    branches:
      - master
    paths:
      - '**.md'

permissions:
  contents: read

jobs:
  linkcheck:
    name: Check Markdown links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lychee link checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          # --accept replaces the default 2xx set, so it has to be listed too.
          # 403 (Forbidden) and 429 (rate limit) avoid bot-blocking false positives.
          args: --accept "200..=299,403,429" --verbose --no-progress './**/*.md'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
