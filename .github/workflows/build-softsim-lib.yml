name: Build SoftSIM Library

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  onomondo-uicc-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout Project
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Install CMake
        uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # v4.3.3
        with:
          cmakeVersion: 3.27.0
          ninjaVersion: 1.11.1

      - name: Install Embedded Toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@4c88c61a77a39a33a7722d24a4e8b2c573f766c9 # v1.11.1

      - name: Apply patches to onomondo-uicc
        working-directory: onomondo-uicc
        run: |
          git apply ../patch/onomondo-uicc/quectel-compat.patch

      - name: Configure
        working-directory: onomondo-uicc
        run: |
          cmake -S . -B build \
            -DCMAKE_C_COMPILER=arm-none-eabi-gcc \
            -DCMAKE_AR=$(which arm-none-eabi-ar) \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=../arm-none-eabi.cmake \
            -DCONFIG_BUILD_LIB_ONLY=y \
            -DCONFIG_NO_DEFAULT_IMPL=y \
            -DCONFIG_USE_EXPERIMENTAL_SUSPEND_COMMAND=y \
            -DCONFIG_USE_SYSTEM_HEAP=n \
            -DCONFIG_USE_UTILS=y \
            -DCONFIG_USE_LOGS=y \
            -DCONFIG_SS_STORAGE_PATH_DEFAULT=UFS:/softsim \
            -DCMAKE_C_FLAGS=-mfloat-abi=hard \
            -DCMAKE_ASM_FLAGS=-mfloat-abi=hard

      - name: Build
        working-directory: onomondo-uicc
        run: cmake --build build --target install
